<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request Access — Synteric Robotics</title>
<meta name="description" content="Request access to the Synteric field pilot program. We're deploying with a small number of restoration and inspection operators.">
<meta name="theme-color" content="#0E1116">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Synteric Robotics">
<meta property="og:title" content="Request Access — Synteric Robotics">
<meta property="og:description" content="Request access to the Synteric field pilot program. We're deploying with a small number of restoration and inspection operators.">
<!-- Absolute by necessity: OG crawlers do not reliably resolve relative URLs. Phase 3 must update these two. -->
<meta property="og:url" content="https://robleuscaesar.github.io/syntericrobotics-site/request-access/">
<meta property="og:image" content="https://robleuscaesar.github.io/syntericrobotics-site/img/og-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<script src="../_ds/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
<script src="../_ds/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../_ds/industry-411e43cb-964d-4091-bb7c-795070cec894/styles.css">
<script src="../_ds/industry-411e43cb-964d-4091-bb7c-795070cec894/_ds_bundle.js"></script>
<style>
html, body { margin:0; padding:0; background:#0E1116; color:#E7E8EA; font-family:Archivo, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
* { box-sizing:border-box; }
a { color:#E7E8EA; text-decoration:none; }
a:hover { color:#2D54F0; }
::selection { background:#2D54F0; color:#F4F3F0; }
input, textarea, button { font-family:inherit; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline:1px solid #2D54F0; outline-offset:2px; }
input::placeholder, textarea::placeholder { color:#5B6471; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</helmet>

<div style="background:#0E1116;min-height:100vh;display:flex;flex-direction:column">

  <header style="border-bottom:1px solid #20242B">
    <div style="max-width:1440px;margin:0 auto;padding:18px clamp(20px,4vw,64px);display:flex;align-items:center;justify-content:space-between;gap:24px">
      <a href="../" style="display:flex;align-items:center;gap:12px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10.6" stroke="#F4F3F0" stroke-width="1"></circle>
          <g stroke="#F4F3F0" stroke-width="1" stroke-linecap="square">
            <path d="M12 1.4 L20.4 6.3"></path>
            <path d="M12 1.4 L20.4 6.3" transform="rotate(60 12 12)"></path>
            <path d="M12 1.4 L20.4 6.3" transform="rotate(120 12 12)"></path>
            <path d="M12 1.4 L20.4 6.3" transform="rotate(180 12 12)"></path>
            <path d="M12 1.4 L20.4 6.3" transform="rotate(240 12 12)"></path>
            <path d="M12 1.4 L20.4 6.3" transform="rotate(300 12 12)"></path>
          </g>
          <circle cx="12" cy="12" r="2.1" fill="#F4F3F0"></circle>
        </svg>
        <span style="display:flex;flex-direction:column;line-height:1">
          <span style="font-family:Archivo;font-weight:600;font-size:19px;letter-spacing:-0.02em;color:#F4F3F0">Synteric</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:0.34em;color:#5B6471;margin-top:4px">ROBOTICS</span>
        </span>
      </a>
      <a href="../" style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;color:#AEB4BD;border-bottom:1px solid transparent" style-hover="color:#F4F3F0;border-bottom:1px solid #2D54F0">← BACK</a>
    </div>
  </header>

  <main style="flex:1;width:100%;max-width:760px;margin:0 auto;padding:clamp(56px,10vw,120px) clamp(20px,4vw,40px) clamp(72px,10vw,140px)">
    <p style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.24em;color:#5B6471;margin:0 0 22px">PILOT PROGRAM</p>
    <h1 style="font-family:Archivo;font-weight:800;font-size:clamp(34px,5.4vw,64px);line-height:1;letter-spacing:-0.035em;color:#F4F3F0;margin:0;max-width:18ch">Tell us about your operation.</h1>

    <sc-if value="{{ submitted }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:clamp(44px,6vw,72px);border-top:1px solid #20242B;padding-top:40px;display:flex;align-items:center;gap:12px">
        <span style="width:6px;height:6px;background:#E0A23A;border-radius:50%"></span>
        <p style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.2em;color:#F4F3F0;margin:0">RECEIVED. WE'LL BE IN TOUCH.</p>
      </div>
    </sc-if>

    <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
      <form onSubmit="{{ submit }}" style="margin-top:clamp(44px,6vw,72px);display:grid;gap:30px">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:30px">
          <label style="display:grid;gap:10px">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.2em;color:#5B6471">NAME</span>
            <input name="name" type="text" required="required" style="background:transparent;border:0;border-bottom:1px solid #20242B;color:#F4F3F0;font-size:16px;padding:10px 0;transition:border-color 200ms ease" style-focus="border-bottom:1px solid #2D54F0">
          </label>
          <label style="display:grid;gap:10px">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.2em;color:#5B6471">COMPANY</span>
            <input name="company" type="text" required="required" style="background:transparent;border:0;border-bottom:1px solid #20242B;color:#F4F3F0;font-size:16px;padding:10px 0;transition:border-color 200ms ease" style-focus="border-bottom:1px solid #2D54F0">
          </label>
          <label style="display:grid;gap:10px">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.2em;color:#5B6471">ROLE</span>
            <input name="role" type="text" style="background:transparent;border:0;border-bottom:1px solid #20242B;color:#F4F3F0;font-size:16px;padding:10px 0;transition:border-color 200ms ease" style-focus="border-bottom:1px solid #2D54F0">
          </label>
          <label style="display:grid;gap:10px">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.2em;color:#5B6471">EMAIL</span>
            <input name="email" type="email" required="required" style="background:transparent;border:0;border-bottom:1px solid #20242B;color:#F4F3F0;font-size:16px;padding:10px 0;transition:border-color 200ms ease" style-focus="border-bottom:1px solid #2D54F0">
          </label>
        </div>

        <fieldset style="border:0;padding:0;margin:10px 0 0;display:grid;gap:14px">
          <legend style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.2em;color:#5B6471;padding:0">MARKETS SERVED</legend>
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            <sc-for list="{{ markets }}" as="m" hint-placeholder-count="4">
              <button type="button" onClick="{{ m.toggle }}" aria-pressed="{{ m.pressed }}" style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;padding:12px 20px;background:{{ m.bg }};color:{{ m.fg }};border:1px solid {{ m.border }};cursor:pointer;transition:border-color 200ms ease,color 200ms ease" style-hover="border:1px solid #5B6471">{{ m.label }}</button>
            </sc-for>
          </div>
        </fieldset>

        <label style="display:grid;gap:10px;max-width:260px">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.2em;color:#5B6471">NUMBER OF LOCATIONS</span>
          <input name="locations" type="number" min="1" step="1" style="background:transparent;border:0;border-bottom:1px solid #20242B;color:#F4F3F0;font-size:16px;padding:10px 0;font-variant-numeric:tabular-nums;transition:border-color 200ms ease" style-focus="border-bottom:1px solid #2D54F0">
        </label>

        <label style="display:grid;gap:10px">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.2em;color:#5B6471">WHAT SPACES DO YOU DEAL WITH MOST?</span>
          <textarea name="spaces" rows="5" style="background:transparent;border:1px solid #20242B;color:#F4F3F0;font-size:16px;line-height:1.6;padding:14px;resize:vertical;transition:border-color 200ms ease" style-focus="border:1px solid #2D54F0"></textarea>
        </label>

        <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:6px">
          <button type="submit" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.2em;white-space:nowrap;background:#2D54F0;color:#F4F3F0;border:1px solid #2D54F0;padding:16px 28px;cursor:pointer;transition:background 200ms ease" style-hover="background:#0E1116;color:#F4F3F0">REQUEST ACCESS</button>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.18em;color:#5B6471">RESPONSES REVIEWED BY THE FIELD TEAM</span>
        </div>
        <sc-if value="{{ failed }}" hint-placeholder-val="{{ false }}">
          <p style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;line-height:1.7;color:#E0A23A;margin:0">{{ errorText }}</p>
        </sc-if>
      </form>
    </sc-if>
  </main>

  <footer style="border-top:1px solid #20242B">
    <div style="max-width:1440px;margin:0 auto;padding:36px clamp(20px,4vw,64px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.2em;color:#5B6471">© 2026 SYNTERIC ROBOTICS</span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { submitted: false, picked: [], error: null, sending: false };

  toggle(label) {
    this.setState(s => ({
      picked: s.picked.includes(label) ? s.picked.filter(x => x !== label) : s.picked.concat(label)
    }));
  }

  renderVals() {
    const picked = this.state.picked;
    return {
      submitted: this.state.submitted,
      open: !this.state.submitted,
      failed: !!this.state.error,
      errorText: this.state.error || "",
      submit: e => {
        e.preventDefault();
        if (this.state.sending) return;
        const form = (e && e.target && e.target.tagName === "FORM") ? e.target : document.querySelector("form");
        const payload = { _subject: "Synteric pilot request" };
        new FormData(form).forEach((v, k) => { payload[k] = v; });
        // MARKETS are component state, not inputs -- they will not serialize on their own.
        payload.markets = this.state.picked.join(", ");
        this.setState({ sending: true, error: null });
        fetch("https://formsubmit.co/ajax/rob@frostrivercapital.com", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify(payload)
        })
          .then(r => r.json().then(j => ({ ok: r.ok, j }), () => ({ ok: r.ok, j: {} })))
          .then(res => {
            // FormSubmit signals success with the STRING "true".
            if (!res.ok || String(res.j.success) !== "true") throw new Error("send failed");
            this.setState({ submitted: true, sending: false });
          })
          .catch(() => this.setState({ sending: false, error: "COULDN’T SEND. CHECK YOUR CONNECTION AND TRY AGAIN." }));
      },
      markets: ['WATER', 'MOLD', 'FIRE', 'INSPECTION'].map(label => {
        const on = picked.includes(label);
        return {
          label,
          pressed: on ? 'true' : 'false',
          bg: on ? '#2D54F0' : 'transparent',
          fg: on ? '#F4F3F0' : '#AEB4BD',
          border: on ? '#2D54F0' : '#20242B',
          toggle: () => this.toggle(label)
        };
      })
    };
  }
}
</script>
</body>
</html>
