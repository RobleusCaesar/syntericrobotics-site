<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synteric Robotics</title>
<meta name="theme-color" content="#0E1116">
<style>
  *,
  *::before,
  *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html { height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #0E1116;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    text-align: center;
  }

  .wordmark {
    font-size: clamp(2.75rem, 11vw, 5.5rem);
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .sub {
    margin-top: 0.95rem;
    font-size: clamp(0.625rem, 2.2vw, 0.75rem);
    font-weight: 500;
    letter-spacing: 0.55em;
    /* offset the trailing letter-space so the word stays optically centered */
    text-indent: 0.55em;
    color: rgba(255, 255, 255, 0.55);
  }

  .meta {
    margin-top: 3.25rem;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: clamp(0.625rem, 1.9vw, 0.75rem);
    letter-spacing: 0.14em;
    color: rgba(255, 255, 255, 0.32);
  }
</style>
</head>
<body>
  <main>
    <h1 class="wordmark">Synteric</h1>
    <p class="sub">ROBOTICS</p>
    <p class="meta">FIELD PILOTS &middot; 2026</p>
  </main>
</body>
</html>
